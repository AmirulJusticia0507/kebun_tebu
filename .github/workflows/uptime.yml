name: Production Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  health:
    name: Check production health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check /healthz
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            https://kebuntebu.vercel.app/healthz)"
          echo "$response" | jq -e '.status == "ok"'

      - name: Check public page
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            --output /dev/null https://kebuntebu.vercel.app/
